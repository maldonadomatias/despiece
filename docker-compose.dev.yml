services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '3000:3000'
    environment:
      - VITE_API_URL=http://localhost:5001/api

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://user:password@postgres:5432/mydb
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=songs
      - S3_REGION=us-east-1
      - AUDIO_SERVICE_URL=http://audio-service:8000
    ports:
      - '5001:5000'

  audio-service:
    build:
      context: ./audio-service
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - demucs-models:/root/.cache/torch
      - ./audio-service/src:/app/src
    environment:
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=songs
      - S3_REGION=us-east-1
      # Dev defaults: keep Demucs + cheap B1/B2 features ON, disable expensive
      # Roformer ensemble + PANNs tagger. ~5-10 min/song instead of 30-60 min.
      # Flip to true once Docker Desktop has 8+ GiB and you're ready for full quality.
      - DESPIECE_USE_ROFORMER_VOCALS=false
      - DESPIECE_USE_ROFORMER_BASS=false
      - DESPIECE_USE_RESIDUAL_SUBTRACT=false
      - DESPIECE_USE_TAGGER=false
      - DESPIECE_USE_DRUM_HITS=true
      - DESPIECE_USE_CHORDS=true
      - DESPIECE_DEMUCS_SEGMENT_SEC=7.8
      - DESPIECE_DEMUCS_OVERLAP=0.1
    command: ['uvicorn', 'src.main:app', '--host', '0.0.0.0', '--port', '8000']
    ports:
      - '8000:8000'

  postgres:
    ports:
      - '5433:5432'

  minio:
    ports:
      - '9000:9000'
      - '9001:9001'

volumes:
  demucs-models:
